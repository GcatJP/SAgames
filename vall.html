<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <title>Speaking Adventure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", cursive;
        --colour-btn-face: black;
        --colour-btn-active: darkgrey;
        --colour-btn-border: #000000;
        --colour-heading-text: darkorange;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: grey;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }
      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: darkgray;
        color: black;
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }
      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: grey;
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4em;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .btn-text {
        flex: 1;
        text-align: center;
        line-height: 1.05;
      }

      .btn-icon {
        height: 78%;
        width: auto;

        flex-shrink: 0;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("jhs1land.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          overflow: hidden;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 7rem);
          padding: 0.1em 0.5em;
          margin-top: 5vh;
          margin-bottom: -8vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: 1fr;
          gap: clamp(10px, 3vw, 30px);
          width: min(90vw, 1000px);
        }

        .btn {
          font-size: clamp(1rem, 5vw, 3.6rem);
          height: clamp(90px, 45vh, 240px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          background-image: url("jhs1land.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 7vw, 4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: -3vh !important;
          margin-bottom: -8vh !important;
        }

        .grid-wrapper {
          padding: 1vh 6vw 2vh;
          margin-top: 1vh;
        }

        .grid {
          gap: clamp(10px, 3vw, 24px) !important;
        }

        .btn {
          height: clamp(55px, 34vh, 140px) !important;
          font-size: clamp(0.85rem, 4.5vw, 2.6rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("jhs1port.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
        }

        .grid-wrapper {
          padding: 2vw 9vw 6vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(12px, 6vw, 60px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.2rem, 10vw, 4rem);
          height: clamp(90px, 26vw, 240px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 10.5vw, 3.9rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(40px, env(safe-area-inset-top, 30px)) !important;
        }

        .grid-wrapper {
          padding: 3.5vh 9vw 2vw !important;
        }

        .grid {
          gap: 28px !important;
          width: 100% !important;
          margin-top: -5vh !important;
        }

        .btn {
          height: clamp(90px, 34vw, 200px) !important;
          font-size: clamp(1.1rem, 11vw, 3.4rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <h1>Vocabulary</h1>
    <a class="back-btn" href="vocab.html">← Back</a>
    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a class="btn" href="vallej.html" style="background-color: darkgray">
          <span class="btn-text">English to Japanese</span>
        </a>

        <a class="btn" href="vallej.html" style="background-color: darkgray">
          <span class="btn-text">Japanese to English</span>
        </a>
      </div>
    </div>
  </body>
</html>
