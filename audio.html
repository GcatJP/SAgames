<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Speaking Adventure" />

    <!-- App icons (multiple resolutions) -->
    <link rel="apple-touch-icon" href="sahp.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Speaking Adventure Audio</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --colour-btn-face: #ffd600;
        --colour-btn-active: darkgray;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-btn-brown: #8b5a2b;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: #8b5a2b;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-y: auto;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px darkred;
      }

      .grid-wrapper {
        flex: 1 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 100%;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: darkred;
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        text-align: center;
        line-height: 1.05;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 1px black;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE: 2 columns, page scrolls */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("saland.png");
        }

        h1 {
          font-size: clamp(2rem, 6vw, 5rem);
          padding: 0.1em 0.5em;
          margin-top: 3vh;
        }

        .grid-wrapper {
          padding: 2vh 2vw 6vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: clamp(8px, 1.6vw, 18px);
          width: min(92vw, 900px);
        }

        .btn {
          font-size: clamp(1.1rem, 3.4vw, 2.6rem);
          height: clamp(60px, 17vh, 110px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 5vw, 2.4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .btn {
          height: clamp(46px, 18vh, 68px) !important;
          font-size: clamp(0.85rem, 2.4vw, 1.4rem) !important;
        }
      }

      /* PORTRAIT: single column, page scrolls */
      @media screen and (orientation: portrait) {
        body {
          background-image: url("saport.png");
        }

        h1 {
          font-size: clamp(1.5rem, 10vw, 3.6rem);
          padding: 0.3em 0.5em;
          margin-top: 56px;
        }

        .grid-wrapper {
          padding: 2vw 9vw 10vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(12px, 3.5vw, 26px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.1rem, 6vw, 2.4rem);
          height: clamp(64px, 17vw, 110px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 8.5vw, 3rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(56px, env(safe-area-inset-top, 30px)) !important;
        }

        .btn {
          height: clamp(64px, 19vw, 100px) !important;
          font-size: clamp(1.05rem, 6vw, 2rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">← Back</a>
    <h1>Speaking Adventure Audio</h1>

    <div class="grid-wrapper">
      <div class="grid" id="audio-grid">
        <!-- Change the text of each button to the track name -->
        <a class="btn" href="audio-player.html?track=t1">Lucy's Big Day</a>
        <a class="btn" href="audio-player.html?track=t2">The Lost Wallet</a>
        <a class="btn" href="audio-player.html?track=t3">Sumo</a>
        <a class="btn" href="audio-player.html?track=t4">Unit 28</a>
        <a class="btn" href="audio-player.html?track=t5">Unit 39a</a>
        <a class="btn" href="audio-player.html?track=t6">Unit 39b</a>
        <a class="btn" href="audio-player.html?track=t7">Unit 39c</a>
        <a class="btn" href="audio-player.html?track=t8">Unit 39d</a>
      </div>
    </div>
  </body>
</html>
