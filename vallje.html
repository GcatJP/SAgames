      }

      .rotate-message {
        display: none;

        z-index: 100;
        background: grey;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: grey; /* dark pink */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
        font-size: clamp(1.5rem, 8vw, 3.5rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.3rem, 6vw, 2rem);
        text-align: center;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 0.8em 1em;
        margin-bottom: 4vh;
        text-align: center;
        width: 100%;
        max-width: 480px;
      }
      .question-jp {
        font-size: clamp(2rem, 11vw, 4.5rem);
        color: #333;
        font-family: var(--font-jp); /* changed back from var(--font-jp) */
        line-height: 1.3;
      }

      .answers {
        display: flex;
        flex-direction: column;
        gap: clamp(12px, 4vw, 24px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;

        transition:

        font-size: clamp(1.1rem, 6vw, 2rem);
        height: clamp(60px, 12vh, 100px);
        padding: 0 0.6em;
      }
      .answers .btn {
        font-family: var(--font-jp);
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;

        text-align: center;
        margin-bottom: 0.3em;

        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.6em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1em;
        font-size: clamp(0.95rem, 4vw, 1.3rem);

        font-weight: bold;
        font-family: var(--font-jp);
      }

      .mistakes-list .en {
        color: var(--colour-wrong);
        font-weight: bold;
        text-align: right;
      }

        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;

        }

          margin-bottom: 3vh;
        }
      }
    </style>

      ];

      let QUESTIONS_PER_GAME = 20; // now variable, set by start-screen buttons

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionJpEl = document.getElementById("questionJp");
      const answersEl = document.getElementById("answers");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(VERB_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;
        questionJpEl.textContent = q.jp; // changed from q.jp

        const distractorPool = VERB_BANK.filter((v) => v.en !== q.en);
        const distractors = shuffle(distractorPool).slice(0, 2);
        const options = shuffle([q, ...distractors]);

        answersEl.innerHTML = "";
        options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt.en; // changed from opt.en
          btn.addEventListener("click", () => handleAnswer(opt, q, btn));
          answersEl.appendChild(btn);
        });
      }

      function handleAnswer(selected, correctQ, clickedBtn) {
        const allBtns = answersEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrect = selected.en === correctQ.en;

        allBtns.forEach((b) => {
          if (b.textContent === correctQ.en) {
            b.classList.add("correct");
          } else if (b === clickedBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrect) {
          score++;
        } else {
          wrongAnswers.push({
            jp: correctQ.jp,
            correct: correctQ.en,
            chosen: selected.en,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }
      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const jpSpan = document.createElement("span");
            jpSpan.className = "jp";
            jpSpan.textContent = w.jp;
            const enSpan = document.createElement("span");
            enSpan.className = "en";
            enSpan.textContent = w.correct;
            li.appendChild(jpSpan);
            li.appendChild(enSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
