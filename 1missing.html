<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Missing Word" />

    <title>Missing Word Grammar Quiz</title>

    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", cursive;
        --colour-btn-face: #8b5a2b;
        --colour-btn-active: #8b5a2b;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
        --colour-correct: #4caf50;
        --colour-wrong: #e53935;
        --colour-dim: #f0f0f0;
        --colour-option-btn: #fff3d6;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: darkred;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: darkred;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 2px yellow;
        font-size: clamp(1.4rem, 7vw, 3rem);
        padding: 0.4em 0.5em 0.2em;
        margin-top: max(16px, env(safe-area-inset-top, 16px));
      }

      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }

      .progress {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-weight: bold;
        font-size: clamp(0.9rem, 4vw, 1.3rem);
        text-align: center;
        margin-bottom: 0.5em;
        flex-shrink: 0;
      }

      /* START SCREEN */
      .start-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3vh;
        width: 100%;
        padding: 2vh 6vw;
      }

      .start-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.2rem, 5.5vw, 1.9rem);
        text-align: center;
      }

      .start-sub {
        color: white;
        opacity: 0.9;
        font-size: clamp(0.85rem, 3.6vw, 1.1rem);
        text-align: center;
        max-width: 420px;
      }

      .start-buttons {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vw, 22px);
        width: 100%;
        max-width: 340px;
      }

      .start-buttons .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        height: clamp(56px, 11vh, 90px);
        font-size: clamp(1.2rem, 6vw, 2rem);
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }
      .start-buttons .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .game-wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
      }

      .question-card {
        background: white;
        border: 3px solid var(--colour-btn-border);
        border-radius: 20px;
        padding: 1.2em 1.2em;
        margin-bottom: 3vh;
        text-align: center;
        width: 100%;
        max-width: 560px;
      }
      .question-label {
        font-family: var(--font-chalk);
        font-size: clamp(0.75rem, 3vw, 0.95rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #999;
        margin-bottom: 0.5em;
      }
      .question-sentence {
        font-size: clamp(1.15rem, 5.4vw, 1.9rem);
        color: #222;
        font-family: var(--font-chalk);
        line-height: 1.5;
      }
      .question-sentence .blank {
        display: inline-block;
        min-width: 2.4em;
        border-bottom: 3px solid #333;
        margin: 0 0.1em;
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 3vw, 16px);
        width: 100%;
        max-width: 480px;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-option-btn);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
        font-size: clamp(1rem, 5vw, 1.5rem);
        min-height: clamp(52px, 9vh, 76px);
        padding: 0.3em 0.8em;
        text-align: center;
      }
      .btn:active {
        transform: scale(0.97);
      }

      .btn.correct {
        background: var(--colour-correct);
        color: white;
      }

      .btn.wrong {
        background: var(--colour-wrong);
        color: white;
      }

      .btn.dim {
        background: var(--colour-dim);
        color: #999;
      }

      .btn:disabled {
        cursor: default;
      }

      /* RESULTS SCREEN */
      .results-wrapper {
        display: none;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 0;
        padding: 2vh 6vw 4vh;
        overflow-y: auto;
      }

      .score {
        color: white;
        -webkit-text-stroke: 1.5px darkorange;
        font-size: clamp(2rem, 10vw, 4rem);
        text-align: center;
        margin-bottom: 0.3em;
      }

      .score-sub {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1rem, 5vw, 1.6rem);
        text-align: center;
        margin-bottom: 1em;
      }

      .mistakes-title {
        color: white;
        -webkit-text-stroke: 1px darkorange;
        font-size: clamp(1.1rem, 5vw, 1.8rem);
        text-align: center;
        margin-bottom: 0.6em;
      }

      .mistakes-list {
        list-style: none;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 2em;
      }

      .mistakes-list li {
        background: white;
        border: 2px solid var(--colour-btn-border);
        border-radius: 12px;
        padding: 0.7em 1em;
        font-family: var(--font-chalk);
        color: #333;
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        font-size: clamp(0.9rem, 3.6vw, 1.15rem);
      }

      .mistakes-list .sentence {
        font-weight: bold;
      }

      .mistakes-list .verdict {
        color: var(--colour-correct);
        font-weight: bold;
      }
      .mistakes-list .your-answer {
        color: var(--colour-wrong);
      }

      .play-again {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: #333;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        cursor: pointer;
        padding: 0.7em 1.6em;
        font-size: clamp(1.1rem, 5vw, 1.6rem);
        transition: transform 0.1s ease;
      }
      .play-again:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      /* LANDSCAPE IPHONE - ask to rotate */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }
        h1,
        .progress,
        .start-wrapper,
        .game-wrapper,
        .results-wrapper,
        .back-btn {
          display: none;
        }
      }

      /* PORTRAIT IPHONE tweaks */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 8vw, 2.1rem) !important;
          margin-top: max(50px, env(safe-area-inset-top, 50px)) !important;
        }
        .game-wrapper {
          padding: 1vh 6vw 3vh;
        }
        .question-card {
          margin-bottom: 2.5vh;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <a class="back-btn" href="grammar.html">← Back</a>
    <h1>Missing Word</h1>
    <div class="progress" id="progress" style="display: none">
      Question 1 / 20
    </div>

    <div class="start-wrapper" id="startWrapper">
      <div class="start-title">Missing Word Quiz</div>
      <div class="start-sub">
        Read each sentence. Choose the correct word to fill the blank.
      </div>
      <div class="start-buttons">
        <button class="btn" data-count="10">10</button>
        <button class="btn" data-count="20">20</button>
        <button class="btn" data-count="30">30</button>
      </div>
    </div>

    <div class="game-wrapper" id="gameWrapper" style="display: none">
      <div class="question-card">
        <div class="question-label">Choose the correct word</div>
        <div class="question-sentence" id="questionSentence"></div>
      </div>
      <div class="options" id="options"></div>
    </div>

    <div class="results-wrapper" id="resultsWrapper" style="display: none">
      <div class="score" id="score"></div>
      <div class="score-sub" id="scoreSub"></div>
      <div class="mistakes-title" id="mistakesTitle" style="display: none">
        Sentences to review
      </div>
      <ul class="mistakes-list" id="mistakesList"></ul>
      <button class="play-again" id="playAgainBtn">Play Again</button>
    </div>

    <script>
      // ---- Missing Word bank: 250 questions based on A2 Grammar List ----

      // ---- Missing Word bank: 260 questions based on Skills for English B1 Grammar List ----
      // Covers grammar points that are NEW at B1 (beyond the existing A2 quiz):
      // present perfect continuous, past perfect, past perfect continuous, future continuous,
      // passive voice, used to/be used to/get used to, phrasal verbs, gerunds & infinitives,
      // modals (permission/requests, deduction, suggestion), relative clauses, adverb clauses,
      // all four conditionals, reflexive/reciprocal pronouns, -ing/-ed adjectives, intensifiers,
      // adjective ordering, comparative adverbs, adverbs with perfect tenses, discourse markers,
      // question tags.
      const MISSING_WORD_BANK = [
        // 1. Present perfect continuous
        {
          text: "He ___ running since 3:30.",
          options: ["has been", "have been", "is"],
          answer: "has been",
        },
        {
          text: "I've ___ thinking about this all day.",
          options: ["been", "be", "being"],
          answer: "been",
        },
        {
          text: "She ___ been studying Japanese for three years.",
          options: ["has", "have", "is"],
          answer: "has",
        },
        {
          text: "We have been ___ here since noon.",
          options: ["waiting", "wait", "waited"],
          answer: "waiting",
        },
        {
          text: "They ___ been practising basketball all week.",
          options: ["have", "has", "was"],
          answer: "have",
        },
        {
          text: "It has been ___ since this morning.",
          options: ["raining", "rain", "rained"],
          answer: "raining",
        },
        {
          text: "My brother has been ___ video games for two hours.",
          options: ["playing", "play", "played"],
          answer: "playing",
        },
        {
          text: "We ___ been learning English since April.",
          options: ["have", "has", "are"],
          answer: "have",
        },
        {
          text: "She has ___ working on her project all afternoon.",
          options: ["been", "be", "being"],
          answer: "been",
        },
        {
          text: "I have been ___ for my keys for ten minutes.",
          options: ["looking", "look", "looked"],
          answer: "looking",
        },

        // 2. Past perfect
        {
          text: "She ___ left the building by 5 pm.",
          options: ["had", "has", "have"],
          answer: "had",
        },
        {
          text: "He had ___ to stay longer.",
          options: ["wanted", "want", "wants"],
          answer: "wanted",
        },
        {
          text: "We had ___ dinner before the movie started.",
          options: ["finished", "finish", "finishes"],
          answer: "finished",
        },
        {
          text: "They ___ already gone home when I arrived.",
          options: ["had", "have", "has"],
          answer: "had",
        },
        {
          text: "I had never ___ snow before that winter.",
          options: ["seen", "saw", "see"],
          answer: "seen",
        },
        {
          text: "The train had ___ by the time we got there.",
          options: ["departed", "depart", "departs"],
          answer: "departed",
        },
        {
          text: "She had ___ her homework before dinner.",
          options: ["finished", "finish", "finishes"],
          answer: "finished",
        },
        {
          text: "We ___ never visited Kyoto before that trip.",
          options: ["had", "have", "has"],
          answer: "had",
        },
        {
          text: "He had ___ the movie twice before I saw it.",
          options: ["watched", "watch", "watches"],
          answer: "watched",
        },
        {
          text: "By the time she woke up, everyone ___ left.",
          options: ["had", "has", "have"],
          answer: "had",
        },

        // 3. Past perfect continuous
        {
          text: "She had been ___ at the hotel when the power went off.",
          options: ["staying", "stay", "stayed"],
          answer: "staying",
        },
        {
          text: "They had ___ asking about the problem until it got solved.",
          options: ["been", "be", "being"],
          answer: "been",
        },
        {
          text: "He had been ___ there for ten years before he retired.",
          options: ["working", "work", "worked"],
          answer: "working",
        },
        {
          text: "We had been ___ for an hour when it started to rain.",
          options: ["walking", "walk", "walked"],
          answer: "walking",
        },
        {
          text: "I ___ been waiting for a reply for days.",
          options: ["had", "have", "has"],
          answer: "had",
        },
        {
          text: "The children had been ___ outside before dinner.",
          options: ["playing", "play", "played"],
          answer: "playing",
        },
        {
          text: "She had ___ practising the piano before the recital.",
          options: ["been", "be", "being"],
          answer: "been",
        },
        {
          text: "We had been ___ for the bus for twenty minutes.",
          options: ["waiting", "wait", "waited"],
          answer: "waiting",
        },
        {
          text: "He had been ___ his bike when it broke down.",
          options: ["riding", "ride", "rode"],
          answer: "riding",
        },
        {
          text: "They had been ___ the garden all morning.",
          options: ["cleaning", "clean", "cleaned"],
          answer: "cleaning",
        },

        // 4. Future continuous
        {
          text: "At this time next week, I will be ___ on my project.",
          options: ["working", "work", "worked"],
          answer: "working",
        },
        {
          text: "They will be ___ to Europe during the summer.",
          options: ["travelling", "travel", "travels"],
          answer: "travelling",
        },
        {
          text: "She will be ___ for her exam tonight.",
          options: ["studying", "study", "studies"],
          answer: "studying",
        },
        {
          text: "We will be ___ dinner when you arrive.",
          options: ["having", "have", "has"],
          answer: "having",
        },
        {
          text: "He will be ___ at the station at six.",
          options: ["waiting", "wait", "waits"],

        {

        {

        {
          text: "The letter was ___ by my grandmother.",

        {

        {
          text: "These photos were ___ last summer.",
          options: ["taken", "take", "took"],

        // 6. Used to / be used to / get used to
        {
          text: "I used to ___ in the park when I was young.",
          options: ["play", "playing", "played"],
          answer: "play",
        },
        {
          text: "I am used to ___ up early.",
          options: ["waking", "wake", "woke"],
          answer: "waking",
        },
        {
          text: "I will ___ used to it eventually.",
          options: ["get", "getting", "got"],
          answer: "get",
        },
        {
          text: "She used to ___ in Tokyo.",
          options: ["live", "living", "lived"],
          answer: "live",
        },
        {
          text: "He is used to ___ spicy food.",
          options: ["eating", "eat", "ate"],
          answer: "eating",
        },
        {
          text: "They are ___ used to the new schedule.",
          options: ["getting", "get", "got"],
          answer: "getting",
        },
        {
          text: "We didn't use to ___ so much homework.",
          options: ["have", "having", "had"],
          answer: "have",
        },
        {
          text: "I'm not used to ___ in a big city.",
          options: ["living", "live", "lived"],
          answer: "living",
        },
        {
          text: "Did you use to ___ soccer when you were a kid?",
          options: ["play", "playing", "played"],
          answer: "play",
        },
        {
          text: "He used to ___ shy, but now he's confident.",
          options: ["be", "being", "been"],
          answer: "be",
        },

        // 7. Phrasal verbs
        {
          text: "I'll ___ up the dishes as long as you do the drying.",
          options: ["wash", "washes", "washed"],
          answer: "wash",
        },
        {
          text: "Don't ___ away your old clothes; take them to a charity shop.",
          options: ["throw", "throws", "threw"],
          answer: "throw",
        },
        {
          text: "I feel like we don't ___ out as much as we used to.",
          options: ["hang", "hangs", "hung"],
          answer: "hang",
        },
        {
          text: "Please ___ off the lights before you leave.",
          options: ["turn", "turns", "turned"],
          answer: "turn",
        },
        {
          text: "She ___ after her little brother yesterday.",
          options: ["looked", "looks", "look"],
          answer: "looked",
        },
        {
          text: "We need to ___ out this problem quickly.",
          options: ["sort", "sorts", "sorted"],

        {

        {

        {
          text: "She ___ her homework before dinner.",
          options: ["handed in", "hands in", "hand in"],
          answer: "handed in",

        // 8. Gerunds and infinitives
        {
          text: "___ is not always easy for me.",
          options: ["Concentrating", "Concentrate", "To concentrating"],
          answer: "Concentrating",
        },
        {
          text: "___ in Europe can be very expensive.",
          options: ["To travel", "Travel", "To traveling"],
          answer: "To travel",
        },
        {
          text: "I look forward to ___ you later.",
          options: ["helping", "help", "helped"],
          answer: "helping",
        },
        {
          text: "My sister decided ___ a job.",
          options: ["to get", "getting", "get"],
          answer: "to get",
        },
        {
          text: "The towel is for ___ your hair.",
          options: ["drying", "dry", "dried"],
          answer: "drying",
        },
        {
          text: "I use a standing desk ___ my posture.",
          options: ["to improve", "improving", "improve"],
          answer: "to improve",

        {
          text: "She enjoys ___ novels in her free time.",
          options: ["reading", "to read", "read"],

        {

          options: ["Anyway", "However", "Firstly"],
          answer: "Anyway",
        },
        {
          text: "___, don't forget to bring your passport.",
          options: ["Finally", "Firstly", "Moreover"],
          answer: "Finally",
        },
        {
          text: "It was raining. ___, we decided to stay home.",
          options: ["Therefore", "Moreover", "Firstly"],
          answer: "Therefore",
        },
        {
          text: "I like tea. ___, I don't like coffee.",
          options: ["However", "Therefore", "Firstly"],
          answer: "However",
        },
        {
          text: "Some people take the bus. Others, ___, prefer to walk.",
          options: ["on the other hand", "as a result", "firstly"],
          answer: "on the other hand",
        },
        {
          text: "He studied hard. ___, he passed the exam.",
          options: ["As a result", "However", "Anyway"],
          answer: "As a result",
        },

        // 26. Question tags
        {
          text: "The race starts over there, ___?",
          options: ["doesn't it", "isn't it", "doesn't he"],
          answer: "doesn't it",
        },
        {
          text: "The book's over there, ___?",
          options: ["isn't it", "doesn't it", "isn't they"],
          answer: "isn't it",
        },
        {
          text: "You like coffee, ___?",
          options: ["don't you", "do you", "doesn't you"],
          answer: "don't you",
        },
        {
          text: "She isn't coming today, ___?",
          options: ["is she", "isn't she", "does she"],
          answer: "is she",
        },
        {
          text: "They can swim, ___?",
          options: ["can't they", "don't they", "can they"],
          answer: "can't they",
        },
        {
          text: "He didn't call you, ___?",
          options: ["did he", "didn't he", "does he"],
          answer: "did he",
        },
        {
          text: "You've finished your homework, ___?",
          options: ["haven't you", "didn't you", "don't you"],
          answer: "haven't you",
        },
        {
          text: "It's a nice day, ___?",
          options: ["isn't it", "doesn't it", "isn't he"],
          answer: "isn't it",
        },
        {
          text: "We should leave now, ___?",
          options: ["shouldn't we", "shouldn't they", "don't we"],
          answer: "shouldn't we",
        },
        {
          text: "You won't be late, ___?",
          options: ["will you", "won't you", "don't you"],
          answer: "will you",
        },
      ];
      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let wrongAnswers = [];

      const startWrapper = document.getElementById("startWrapper");
      const gameWrapper = document.getElementById("gameWrapper");
      const resultsWrapper = document.getElementById("resultsWrapper");
      const questionSentenceEl = document.getElementById("questionSentence");
      const optionsEl = document.getElementById("options");
      const progressEl = document.getElementById("progress");
      const scoreEl = document.getElementById("score");
      const scoreSubEl = document.getElementById("scoreSub");
      const mistakesTitleEl = document.getElementById("mistakesTitle");
      const mistakesListEl = document.getElementById("mistakesList");
      const playAgainBtn = document.getElementById("playAgainBtn");

      function shuffle(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startGame() {
        questions = shuffle(MISSING_WORD_BANK).slice(0, QUESTIONS_PER_GAME);
        currentIndex = 0;
        score = 0;
        wrongAnswers = [];
        startWrapper.style.display = "none";
        resultsWrapper.style.display = "none";
        gameWrapper.style.display = "flex";
        progressEl.style.display = "block";
        renderQuestion();
      }

      function renderQuestion() {
        const q = questions[currentIndex];
        progressEl.textContent =
          "Question " + (currentIndex + 1) + " / " + QUESTIONS_PER_GAME;

        questionSentenceEl.innerHTML = q.text.replace(
          "___",
          '<span class="blank">&nbsp;</span>',
        );

        optionsEl.innerHTML = "";
        const shuffledOptions = shuffle(q.options);
        shuffledOptions.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = opt;
          btn.addEventListener("click", () => handleAnswer(opt, btn));
          optionsEl.appendChild(btn);
        });
      }

      function handleAnswer(chosen, chosenBtn) {
        const q = questions[currentIndex];
        const allBtns = optionsEl.querySelectorAll(".btn");
        allBtns.forEach((b) => (b.disabled = true));

        const isCorrectAnswer = chosen === q.answer;

        allBtns.forEach((b) => {
          if (b.textContent === q.answer) {
            b.classList.add("correct");
          } else if (b === chosenBtn) {
            b.classList.add("wrong");
          } else {
            b.classList.add("dim");
          }
        });

        if (isCorrectAnswer) {
          score++;
        } else {
          wrongAnswers.push({
            text: q.text,
            answer: q.answer,
            chosen: chosen,
          });
        }

        setTimeout(() => {
          currentIndex++;
          if (currentIndex < questions.length) {
            renderQuestion();
          } else {
            showResults();
          }
        }, 900);
      }

      function showResults() {
        gameWrapper.style.display = "none";
        progressEl.style.display = "none";
        resultsWrapper.style.display = "flex";

        scoreEl.textContent = score + " / " + QUESTIONS_PER_GAME;
        if (score === QUESTIONS_PER_GAME) {
          scoreSubEl.textContent = "Perfect score! 🎉";
        } else if (score >= QUESTIONS_PER_GAME * 0.7) {
          scoreSubEl.textContent = "Great job!";
        } else {
          scoreSubEl.textContent = "Keep practising!";
        }

        mistakesListEl.innerHTML = "";
        if (wrongAnswers.length > 0) {
          mistakesTitleEl.style.display = "block";
          wrongAnswers.forEach((w) => {
            const li = document.createElement("li");
            const sentSpan = document.createElement("span");
            sentSpan.className = "sentence";
            sentSpan.textContent = w.text.replace("___", "_____");
            const yourSpan = document.createElement("span");
            yourSpan.className = "your-answer";
            yourSpan.textContent = "You chose: " + w.chosen;
            const verdictSpan = document.createElement("span");
            verdictSpan.className = "verdict";
            verdictSpan.textContent = "Correct answer: " + w.answer;
            li.appendChild(sentSpan);
            li.appendChild(yourSpan);
            li.appendChild(verdictSpan);
            mistakesListEl.appendChild(li);
          });
        } else {
          mistakesTitleEl.style.display = "none";
        }
      }

      // start-screen buttons pick the question count and begin the game
      document.querySelectorAll(".start-buttons .btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          QUESTIONS_PER_GAME = parseInt(btn.dataset.count, 10);
          startGame();
        });
      });

      // play again re-shows the start screen so a new count can be picked
      playAgainBtn.addEventListener("click", () => {
        resultsWrapper.style.display = "none";
        startWrapper.style.display = "flex";
      });
    </script>
  </body>
