<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />

    <title>Speaking Adventure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Chalkboard", "Comic Neue", "Comic Sans MS", cursive;
        --colour-btn-face: darkgray;
        --colour-btn-active: grey;
        --colour-btn-border: #000000;
        --colour-heading-text: orange;
      }

      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: grey;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--colour-heading-text);
        -webkit-text-stroke: 0.8px darkorange;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family: var(--font-chalk);
        background-color: grey;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family: var(--font-chalk);
        color: var(--colour-heading-text);
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        -webkit-text-stroke: 1px yellow;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        color: yellow;
        background: var(--colour-btn-face);
        border: 2px solid var(--colour-btn-border);
        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4em;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--colour-btn-active);
      }

      .btn-text {
        flex: 1;
        text-align: center;
        line-height: 1.05;
      }

      .btn-icon {
        height: 78%;
        width: auto;
        aspect-ratio: 1 / 1;
        flex-shrink: 0;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .back-btn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        left: max(16px, env(safe-area-inset-left, 16px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--colour-btn-face);
        color: var(--colour-btn-border);
        border: 2px solid var(--colour-btn-border);
        border-radius: 999px;
        padding: 0.4em 0.9em;
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        -webkit-text-stroke: 0;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
        background: var(--colour-btn-active);
      }
      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("./jhs1land.png");
          overflow: hidden;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 7rem);
          padding: 0.1em 0.5em;
          margin-top: 5vh;
          margin-bottom: -8vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(2, 1fr);
          gap: clamp(10px, 2vw, 24px);
          width: min(85vw, 900px);
          height: min(70vh, 460px);
        }

        .btn {
          font-size: clamp(1rem, 4.5vw, 3.4rem);
          height: clamp(80px, 45vh, 220px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }

        h1,
        .grid-wrapper,
        .back-btn {
          display: none;
        }

        body {
          background-image: url("./jhs1land.png");
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        .grid-wrapper {
          padding: 1vh 4vw 2vh;
          margin-top: 1vh;
        }

        .grid {
          grid-template-columns: repeat(2, 1fr) !important;
          grid-template-rows: repeat(2, 1fr) !important;
          width: min(92vw, 500px) !important;
          height: min(80vh, 220px) !important;
          gap: clamp(6px, 1.5vw, 14px) !important;
        }

        .btn {
          height: clamp(55px, 34vh, 130px) !important;
          font-size: clamp(1rem, 6vw, 3.4rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("./jhs1port.png");
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: max(20px, env(safe-area-inset-top, 20px));
        }

        .grid-wrapper {
          padding: 2vw 9vw 6vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(8px, 5vw, 50px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.1rem, 9vw, 3.6rem);
          height: clamp(80px, 30vw, 250px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 10.5vw, 3.9rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(40px, env(safe-area-inset-top, 30px)) !important;
        }

        .grid-wrapper {
          padding: 3.5vh 9vw 2vw !important;
        }

        .btn {
          height: clamp(80px, 30vw, 180px) !important;
          font-size: clamp(1rem, 10vw, 3.1rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="rotate-message">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>

    <h1>Vocabulary</h1>
    <a class="back-btn" href="A2.html">← Back</a>
    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a class="btn" href="vn.html" style="background-color: #8b5a2b">
          <span class="btn-text">Nouns</span>
        </a>

        <a class="btn" href="vv.html" style="background-color: #8b5a2b">
          <span class="btn-text">Verbs</span>
        </a>

        <a class="btn" href="va.html" style="background-color: #8b5a2b">
          <span class="btn-text">Adjectives</span>
        </a>
        <a class="btn" href="vall.html" style="background-color: #8b5a2b">
          <span class="btn-text">All Vocabulary</span>
        </a>
      </div>
    </div>
  </body>
</html>
